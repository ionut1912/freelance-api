services:
  gateway:
    build:
      context: Freelance.ApiGateway
      dockerfile: src/Freelance.ApiGateway/Dockerfile
    ports:
      - "9000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - JwtSettings__Key=YourSuperSecretKeyHere123!ChangeItTo32PlusChars
      - JwtSettings__Issuer=FreelanceApp
      - JwtSettings__Audience=FreelanceAppUsers
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=Freelance-Gateway
    depends_on:
      - freelance_identity
      - freelance_user_profiles
      - alloy
    networks:
      - freelance-network

  freelance_identity:
    build:
      context: Freelance.Identity
      dockerfile: src/Freelance.Identity.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=FreelanceIdentity;Username=postgres;Password=postgres
      - JwtSettings__Key=YourSuperSecretKeyHere123!ChangeItTo32PlusChars
      - JwtSettings__Issuer=FreelanceApp
      - JwtSettings__Audience=FreelanceAppUsers
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=Freelance-Identity
    depends_on:
      - alloy
    networks:
      - freelance-network

  freelance_user_profiles:
    build:
      context: Freelance.UserProfiles
      dockerfile: src/Freelance.UserProfiles.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=FreelanceUserProfiles;Username=postgres;Password=postgres
      - JwtSettings__Key=YourSuperSecretKeyHere123!ChangeItTo32PlusChars
      - JwtSettings__Issuer=FreelanceApp
      - JwtSettings__Audience=FreelanceAppUsers
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=Freelance-UserProfiles
    depends_on:
      - alloy
    networks:
      - freelance-network

  alloy:
    image: grafana/alloy:latest
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    volumes:
      - ./alloy-config.yaml:/etc/alloy/config.alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - freelance-network

  loki:
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - freelance-network

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    volumes:
      - tempo_data:/tmp/tempo
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "9095:9095"  # Changed from 4317 to avoid conflict
    networks:
      - freelance-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    networks:
      - freelance-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - freelance-network

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:

networks:
  freelance-network: