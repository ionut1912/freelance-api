services:
  gateway:
    build:
      context: Freelance.ApiGateway
      dockerfile: src/Freelance.ApiGateway/Dockerfile
    ports:
      - "9000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__Key=YourSuperSecretKeyHere123!ChangeItTo32PlusChars
      - JwtSettings__Issuer=FreelanceApp
      - JwtSettings__Audience=FreelanceAppUsers
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://loki:3100
      - OTEL_SERVICE_NAME=Freelance-Gateway
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    depends_on:
      - freelance_identity
      - freelance_user_profiles
      - freelance_face
      - freelance_project_management
      - tempo
      - loki
    networks:
      - freelance-network

  freelance_identity:
    build:
      context: Freelance.Identity
      dockerfile: src/Freelance.Identity.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=FreelanceIdentity;Username=postgres;Password=postgres
      - JwtSettings__Key=YourSuperSecretKeyHere123!ChangeItTo32PlusChars
      - JwtSettings__Issuer=FreelanceApp
      - JwtSettings__Audience=FreelanceAppUsers
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://loki:3100
      - OTEL_SERVICE_NAME=Freelance-Identity
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - freelance-network

  freelance_user_profiles:
    build:
      context: Freelance.UserProfiles
      dockerfile: src/Freelance.UserProfiles.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=FreelanceUserProfiles;Username=postgres;Password=postgres
      - JwtSettings__Key=YourSuperSecretKeyHere123!ChangeItTo32PlusChars
      - JwtSettings__Issuer=FreelanceApp
      - JwtSettings__Audience=FreelanceAppUsers
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - RabbitMq__Exchanges__0__Name=face.events
      - RabbitMq__Exchanges__0__Type=topic
      - RabbitMq__Exchanges__0__Durable=true
      - RabbitMq__Exchanges__0__AutoDelete=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://loki:3100
      - OTEL_SERVICE_NAME=Freelance-UserProfiles
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - freelance-network

  freelance_face:
    build:
      context: Freelance.Face
      dockerfile: src/Freelance.Face.Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
        APP_UID: 0
    ports:
      - "9010:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - FRONTEND_BASE_URL=http://localhost:3000
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - RabbitMq__Exchanges__0__Name=face.events
      - RabbitMq__Exchanges__0__Type=topic
      - RabbitMq__Exchanges__0__Durable=true
      - RabbitMq__Exchanges__0__AutoDelete=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://loki:3100
      - OTEL_SERVICE_NAME=Freelance-Face
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - freelance-network

  freelance_project_management:
    build:
      context: Freelance.ProjectManagement
      dockerfile: src/Freelance.ProjectManagement.Api/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=FreelanceProjectManagement;Username=postgres;Password=postgres
      - JwtSettings__Key=YourSuperSecretKeyHere123!ChangeItTo32PlusChars
      - JwtSettings__Issuer=FreelanceApp
      - JwtSettings__Audience=FreelanceAppUsers
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://loki:3100
      - OTEL_SERVICE_NAME=Freelance-Project-Management
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - freelance-network

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
      - "9096:9096"
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - freelance-network

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    user: "0:0"
    volumes:
      - tempo_data:/tmp/tempo
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - freelance-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    networks:
      - freelance-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - freelance-network

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:

networks:
  freelance-network: