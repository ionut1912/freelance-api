name: CI

on:
  pull_request:
  push:
    branches: [master, main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  ContinuousIntegrationBuild: true
  # global.json selects the SDK; the projects target net10.0, so their tests also need this runtime.
  DOTNET_RUNTIME_VERSION: 10.0.x
  COVERAGE_THRESHOLD: 80
  # Private GitHub Packages feed (Shared.* packages). Prefer a classic PAT with read:packages stored as the
  # NUGET_AUTH_TOKEN secret; GITHUB_TOKEN only works if the packages grant this repository read access.
  NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN || github.token }}

jobs:
  shared-events:
    name: Freelance.Shared.Events
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Freelance.Shared.Events

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: ${{ env.DOTNET_RUNTIME_VERSION }}

      - name: Restore tools
        working-directory: .
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore Freelance.Shared.Events.csproj --locked-mode

      - name: Format check
        run: dotnet format Freelance.Shared.Events.csproj --verify-no-changes --no-restore

      # The project has GeneratePackageOnBuild=true, so a Release build produces the package.
      - name: Build and analyzers
        run: dotnet build Freelance.Shared.Events.csproj -c Release --no-restore -warnaserror -p:PackageOutputPath="${{ runner.temp }}/nupkg"

      - name: Vulnerable packages
        run: bash ../.github/scripts/check-vulnerable.sh Freelance.Shared.Events.csproj

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: freelance-shared-events
          path: ${{ runner.temp }}/nupkg/*.nupkg
          if-no-files-found: error

  service:
    name: ${{ matrix.service }}
    needs: shared-events
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - Freelance.ApiGateway
          - Freelance.Face
          - Freelance.Identity
          - Freelance.ProjectManagement
          - Freelance.UserProfiles
    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: ${{ env.DOTNET_RUNTIME_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('{0}/**/packages.lock.json', matrix.service), format('{0}/Directory.Packages.props', matrix.service)) }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.service }}-

      # Services consume the Freelance.Shared.Events version built from this commit, not the published one.
      - name: Download Freelance.Shared.Events
        uses: actions/download-artifact@v4
        with:
          name: freelance-shared-events
          path: ${{ runner.temp }}/localfeed

      - name: Use local package feed
        run: bash ../.github/scripts/use-local-feed.sh nuget.config "${{ runner.temp }}/localfeed"

      - name: Install native dependencies (dlib)
        if: matrix.service == 'Freelance.Face'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0t64 libgl1 libsm6 libxrender1 libxext6 libgomp1 libopenblas0

      # Checks run cheapest first, so a badly formatted file or a warning fails before the tests start.
      - name: Restore tools
        working-directory: .
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore ${{ matrix.service }}.slnx --locked-mode

      - name: Format check
        run: dotnet format ${{ matrix.service }}.slnx --verify-no-changes --no-restore

      - name: Build and analyzers
        run: dotnet build ${{ matrix.service }}.slnx -c Release --no-restore -warnaserror

      # global.json selects Microsoft.Testing.Platform, which uses these options instead of --logger/--collect.
      - name: Unit tests
        id: unit
        run: >
          dotnet test --project tests/${{ matrix.service }}.UnitTests -c Release --no-build
          --results-directory "$GITHUB_WORKSPACE/TestResults/unit"
          --coverage --coverage-output-format cobertura --coverage-settings "$GITHUB_WORKSPACE/coverage.settings.xml"
          --report-xunit-trx --report-xunit-markdown

      # Integration tests boot the real APIs (WebApplicationFactory) against PostgreSQL started by Testcontainers.
      - name: Integration tests
        run: >
          dotnet test --project tests/${{ matrix.service }}.IntegrationTests -c Release --no-build
          --results-directory "$GITHUB_WORKSPACE/TestResults/integration"
          --coverage --coverage-output-format cobertura --coverage-settings "$GITHUB_WORKSPACE/coverage.settings.xml"
          --report-xunit-trx --report-xunit-markdown

      - name: Test summary
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        working-directory: .
        run: |
          for report in TestResults/*/*.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Merge coverage (unit + integration)
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        working-directory: .
        run: |
          dotnet reportgenerator \
            "-reports:TestResults/**/*.cobertura.xml" \
            "-targetdir:CoverageReport" \
            "-reporttypes:Cobertura;HtmlInline;MarkdownSummaryGithub" \
            "-title:${{ matrix.service }}"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage >= ${{ env.COVERAGE_THRESHOLD }}%
        working-directory: .
        run: bash .github/scripts/check-coverage.sh CoverageReport/Cobertura.xml "$COVERAGE_THRESHOLD"

      - name: Upload test results and coverage
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/*.md
            CoverageReport/
          if-no-files-found: ignore

      - name: Vulnerable packages
        run: bash ../.github/scripts/check-vulnerable.sh ${{ matrix.service }}.slnx

      - name: Deprecated and outdated packages (warning only)
        continue-on-error: true
        run: |
          for kind in deprecated outdated; do
            if ! report=$(dotnet list ${{ matrix.service }}.slnx package --$kind 2>&1); then
              echo "$report"
              echo "::warning title=${{ matrix.service }}::Could not check for $kind packages."
              continue
            fi
            echo "$report"
            if grep -qE '^\s+> ' <<< "$report"; then
              echo "::warning title=${{ matrix.service }}::Some packages are $kind; see the step log."
            fi
          done

  # The single status check to require in branch protection: it stays valid when the matrix changes.
  # Any future deploy or release job must declare "needs: ci-passed".
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [shared-events, service]
    runs-on: ubuntu-latest
    steps:
      - name: All checks succeeded
        run: |
          echo "shared-events: ${{ needs.shared-events.result }}, services: ${{ needs.service.result }}"
          [ "${{ needs.shared-events.result }}" = "success" ] && [ "${{ needs.service.result }}" = "success" ]
